{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<style>
    .add-product-page {
        min-height: calc(100vh - 120px);
        background: #f7f7f7;
        padding: 35px 16px 60px;
    }

    .add-product-card {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 32px;
        box-sizing: border-box;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    .add-product-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eeeeee;
    }

    .add-product-icon {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        border-radius: 12px;
        background: #fff4df;
        color: #d99923;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .add-product-icon .material-symbols-outlined {
        font-size: 28px;
    }

    .add-product-header h2 {
        margin: 0;
        color: #222;
        font-size: 25px;
        font-weight: 700;
    }

    .add-product-header p {
        margin: 5px 0 0;
        color: #777;
        font-size: 13px;
        line-height: 1.5;
    }

    #add-product-form {
        margin: 0;
    }

    #add-product-form p {
        margin: 0 0 19px;
    }

    #add-product-form label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-size: 14px;
        font-weight: 600;
    }

    #add-product-form input,
    #add-product-form textarea,
    #add-product-form select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px 14px;
        border: 1px solid #d8d8d8;
        border-radius: 9px;
        background: #ffffff;
        color: #222;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease,
                    box-shadow 0.2s ease;
    }

    #add-product-form textarea {
        min-height: 110px;
        resize: vertical;
        line-height: 1.5;
    }

    #add-product-form input[type="file"] {
        padding: 10px;
        background: #fafafa;
        cursor: pointer;
    }

    #add-product-form input:focus,
    #add-product-form textarea:focus,
    #add-product-form select:focus {
        border-color: #d99923;
        box-shadow: 0 0 0 3px rgba(217, 153, 35, 0.12);
    }

    #add-product-form input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
        accent-color: #d99923;
    }

    #add-product-form ul.errorlist {
        margin: 6px 0 8px;
        padding: 0;
        list-style: none;
        color: #c62828;
        font-size: 13px;
    }

    #add-product-form .helptext {
        display: block;
        margin-top: 6px;
        color: #888;
        font-size: 12px;
        line-height: 1.4;
    }

    .product-form-section {
        margin-bottom: 25px;
    }

    .product-form-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
        color: #333;
        font-size: 15px;
        font-weight: 700;
    }

    .product-form-section-title .material-symbols-outlined {
        color: #d99923;
        font-size: 21px;
    }

    .save-product-btn {
        width: 100%;
        min-height: 52px;
        margin-top: 5px;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #d99923;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: background 0.2s ease,
                    transform 0.1s ease;
    }

    .save-product-btn:hover {
        background: #c88918;
    }

    .save-product-btn:active {
        transform: scale(0.99);
    }

    .form-note {
        margin-top: 18px;
        padding: 13px 15px;
        border-radius: 9px;
        background: #fafafa;
        border: 1px solid #eeeeee;
        color: #777;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
    }

    @media (max-width: 600px) {
        .add-product-page {
            padding: 24px 12px 45px;
        }

        .add-product-card {
            padding: 24px 18px;
            border-radius: 14px;
        }

        .add-product-header h2 {
            font-size: 22px;
        }

        .add-product-header p {
            font-size: 12px;
        }
    }
</style>

<div class="add-product-page">

    <div class="add-product-card">

        <div class="add-product-header">

            <div class="add-product-icon">
                <span class="material-symbols-outlined">
                    add_business
                </span>
            </div>

            <div>
                <h2>Add Product</h2>

                <p>
                    Add a product to your WaziTrade seller store.
                </p>
            </div>

        </div>


        <form method="POST"
              enctype="multipart/form-data"
              id="add-product-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="save-product-btn">

                <span class="material-symbols-outlined"
                      style="font-size:20px;vertical-align:middle;margin-right:6px;">
                    save
                </span>

                Save Product

            </button>

        </form>


        <div class="form-note">
            Make sure your product information, price and images are
            accurate before saving.
        </div>

    </div>

</div>


<!-- ========== SUBCATEGORY AUTO-LOADER ========== -->

<script>
document.addEventListener("DOMContentLoaded", function () {
    const categoryField = document.getElementById("id_category");
    const subcategoryField = document.getElementById("id_subcategory");

    if (!categoryField || !subcategoryField) return;

    categoryField.addEventListener("change", function () {
        const categoryID = this.value;

        if (!categoryID) {
            subcategoryField.innerHTML = "<option value=''>---------</option>";
            return;
        }

        fetch(`/get-subcategories/${categoryID}/`)
            .then(response => response.json())
            .then(data => {
                subcategoryField.innerHTML = "";

                if (data.subcategories.length === 0) {
                    subcategoryField.innerHTML =
                        "<option value=''>No subcategories</option>";
                } else {
                    data.subcategories.forEach(sub => {
                        subcategoryField.innerHTML +=
                            `<option value="${sub.id}">${sub.name}</option>`;
                    });
                }
            })
            .catch(error =>
                console.error(
                    "Error loading subcategories:",
                    error
                )
            );
    });
});
</script>

{% endblock %}
