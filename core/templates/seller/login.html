{% extends "base.html" %}
{% load static %}

{% block title %}Seller Login{% endblock %}

{% block navbar %}{% endblock %}
{% block mobile_footer %}{% endblock %}

{% block content %}

<div class="seller-login-container">

    {% load static %}

<img
    src="{% static 'core/images/seller-login.jpg' %}"
    class="seller-login-illustration"
    alt="Seller"
>

    <h2>You are now a Seller</h2>

    <form method="POST" action="">
        {% csrf_token %}

        <label for="username">
            Email or Username
        </label>

        <input
            type="text"
            name="username"
            id="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            name="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
