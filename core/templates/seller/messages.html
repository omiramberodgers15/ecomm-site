{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Messages</h2>
<p>Unread messages: {{ unread_count }}</p>

<div id="messages-container">
    {% for msg in messages %}
        <div id="chat-box-{{ msg.id }}">
            <b>{{ msg.sender.username }}:</b> {{ msg.content }}
        </div>

        <!-- Reply input and button -->
        <input type="text" id="reply-input-{{ msg.id }}" placeholder="Type your reply...">
        <button class="reply-btn" data-session-id="{{ msg.session.id }}">
    Reply
</button>

    {% empty %}
        <p>No messages yet.</p>
    {% endfor %}
</div>

<script>
const csrftoken = '{{ csrf_token }}';

function sendMessage(sessionId, messageContent) {
    if (!messageContent) return;

    fetch("{% url 'chat:send_message' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": csrftoken,
        },
        body: new URLSearchParams({
            "session_id": sessionId,
            "content": messageContent
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.error) {
            console.error("Message failed:", data.error);
            return;
        }

        console.log("Message sent:", data);

        const container = document.getElementById(
            'messages-container'
        );

        const div = document.createElement('div');

        div.innerHTML = `
            <b>${data.sender}:</b> ${data.content}
        `;

        container.appendChild(div);
    })
    .catch(error => {
        console.error("Error sending message:", error);
    });
}


document.querySelectorAll(".reply-btn").forEach(btn => {

    btn.addEventListener("click", function() {

        const sessionId = this.dataset.sessionId;

        const input = this.previousElementSibling;

        if (!input) return;

        const content = input.value.trim();

        if (!content) return;

        sendMessage(
            sessionId,
            content
        );

        input.value = "";
    });

});
</script>
{% endblock %}
